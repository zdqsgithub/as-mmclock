model_type: elasticnet
feature_type: site
coverage_min: 5
missing_frac: 0.2
n_cpg_prefilter: 20000
age_transform: log
imputation: median
# NN params (used when model_type in [mlp, cnn, transformer])
dropout: 0.3
lr: 0.0005
batch_size: 32
max_epochs: 200
early_stopping_patience: 20
# Output
output_dir: results/runs/baseline
